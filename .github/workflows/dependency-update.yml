name: Dependency Update Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check for updates
        run: |
          echo "# Dependency Update Report" > dependency-report.md
          echo "" >> dependency-report.md
          echo "Generated on: $(date)" >> dependency-report.md
          echo "" >> dependency-report.md

          for service in api-gateway payment-service campaign-service pledge-service mock-pg-service; do
            echo "## $service" >> dependency-report.md
            echo "" >> dependency-report.md
            cd $service
            mvn versions:display-dependency-updates -B >> ../dependency-report.md 2>&1 || true
            mvn versions:display-plugin-updates -B >> ../dependency-report.md 2>&1 || true
            echo "" >> ../dependency-report.md
            cd ..
          done

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-report
          path: dependency-report.md
          retention-days: 30

      - name: Create Issue if updates available
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('dependency-report.md', 'utf8');

            if (report.includes('The following dependencies in Dependencies have newer versions')) {
              const issueBody = `## Dependency Updates Available\n\n${report}\n\nPlease review and update dependencies as needed.`;

              // Check if an issue already exists
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'dependencies'
              });

              const existingIssue = issues.data.find(issue =>
                issue.title === 'Dependency Updates Available'
              );

              if (!existingIssue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'Dependency Updates Available',
                  body: issueBody,
                  labels: ['dependencies', 'maintenance']
                });
              }
            }
