# Server Configuration
spring.application.name=payment-service
server.port=8081

# PostgreSQL Configuration (Environment Variable Support)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration (Environment Variable Support)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000

# RabbitMQ Configuration (Environment Variable Support)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Outbox Polling Configuration
outbox.polling.interval=2000
outbox.polling.batch-size=100

# Idempotency Configuration
idempotency.ttl-seconds=86400

# Mock Gateway Configuration
mock.gateway.url=${MOCK_PG_SERVICE_URL:http://localhost:8084}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Distributed Tracing (Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

# Metrics
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging
logging.level.com.careforall.payment=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.amqp=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Idempotency Configuration
idempotency.ttl-seconds=86400

# Logging
logging.level.com.careforall.payment=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.amqp=DEBUG
