version: '3.8'

services:
  # ==========================================
  # INFRASTRUCTURE SERVICES
  # ==========================================

  # PostgreSQL - Payment Database
  postgres-payment:
    image: postgres:15-alpine
    container_name: careforall-postgres-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careforall-network

  # PostgreSQL - Campaign Database
  postgres-campaign:
    image: postgres:15-alpine
    container_name: careforall-postgres-campaign
    environment:
      POSTGRES_DB: campaign_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - campaign-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careforall-network

  # PostgreSQL - Pledge Database
  postgres-pledge:
    image: postgres:15-alpine
    container_name: careforall-postgres-pledge
    environment:
      POSTGRES_DB: pledge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pledge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careforall-network

  # Redis - Caching & Idempotency
  redis:
    image: redis:7-alpine
    container_name: careforall-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - careforall-network

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: careforall-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - careforall-network

  # ==========================================
  # OBSERVABILITY STACK
  # ==========================================

  # Zipkin - Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: careforall-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careforall-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: careforall-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careforall-network
    depends_on:
      - api-gateway
      - payment-service
      - campaign-service

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: careforall-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careforall-network
    depends_on:
      - prometheus

  # Elasticsearch - Log Storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: careforall-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - careforall-network

  # Kibana - Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: careforall-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - careforall-network
    depends_on:
      - elasticsearch

  # ==========================================
  # APPLICATION SERVICES
  # ==========================================

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: careforall-api-gateway
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8081
      - CAMPAIGN_SERVICE_URL=http://campaign-service:8082
      - PLEDGE_SERVICE_URL=http://pledge-service:8083
      - MOCK_PG_SERVICE_URL=http://mock-pg-service:8084
      - ZIPKIN_URL=http://zipkin:9411
      - JWT_SECRET=careforall-super-secret-key-for-jwt-signing-must-be-at-least-256-bits
    ports:
      - "8080:8080"
    networks:
      - careforall-network
    depends_on:
      payment-service:
        condition: service_healthy
      campaign-service:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Payment Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: careforall-payment-service
    environment:
      - DB_HOST=postgres-payment
      - DB_PORT=5432
      - DB_NAME=payment_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - ZIPKIN_URL=http://zipkin:9411
      - MOCK_PG_SERVICE_URL=http://mock-pg-service:8084
    ports:
      - "8081:8081"
    networks:
      - careforall-network
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/v1/payment/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Campaign Service
  campaign-service:
    build:
      context: ./campaign-service
      dockerfile: Dockerfile
    container_name: careforall-campaign-service
    environment:
      - DB_HOST=postgres-campaign
      - DB_PORT=5432
      - DB_NAME=campaign_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - ZIPKIN_URL=http://zipkin:9411
    ports:
      - "8082:8082"
    networks:
      - careforall-network
    depends_on:
      postgres-campaign:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/api/v1/campaign/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Pledge Service
  pledge-service:
    build:
      context: ./pledge-service
      dockerfile: Dockerfile
    container_name: careforall-pledge-service
    environment:
      - DB_HOST=postgres-pledge
      - DB_PORT=5432
      - DB_NAME=pledge_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - ZIPKIN_URL=http://zipkin:9411
    ports:
      - "8083:8083"
    networks:
      - careforall-network
    depends_on:
      postgres-pledge:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/api/v1/pledge/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Mock Payment Gateway Service
  mock-pg-service:
    build:
      context: ./mock-pg-service
      dockerfile: Dockerfile
    container_name: careforall-mock-pg-service
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8081
      - ZIPKIN_URL=http://zipkin:9411
    ports:
      - "8084:8084"
    networks:
      - careforall-network
    depends_on:
      zipkin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/api/v1/mock-gateway/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

# ==========================================
# NETWORKS
# ==========================================
networks:
  careforall-network:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  payment-db-data:
  campaign-db-data:
  pledge-db-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
